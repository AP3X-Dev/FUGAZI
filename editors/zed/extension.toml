id = "fugazi"
name = "Fugazi"
description = "Codebase intelligence for TypeScript and JavaScript: dead code, duplication, complexity, architecture drift."
version = "0.1.0"
schema_version = 1
authors = ["Fugazi contributors"]
repository = "https://github.com/fugazi/fugazi"

[language_servers.fugazi]
name = "Fugazi"
languages = ["TypeScript", "TSX", "JavaScript", "JSX", "Vue", "Svelte", "Astro"]

[language_servers.fugazi.configuration_options]
preset = { type = "string", default = "default", enum = ["default", "ci", "strict"] }
format = { type = "string", default = "human", enum = ["human", "human-plain", "json", "sarif", "compact", "markdown", "codeclimate"] }

[grammars.typescript]
repository = "https://github.com/tree-sitter/tree-sitter-typescript"
commit = "main"
