pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json,jsonc}"
      run: bun x biome check --apply --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      glob: "packages/**/*.{ts,tsx}"
      run: bun run typecheck
      env:
        NODE_OPTIONS: --max-old-space-size=8192
pre-push:
  commands:
    test:
      run: bun run test
      env:
        NODE_OPTIONS: --max-old-space-size=8192
