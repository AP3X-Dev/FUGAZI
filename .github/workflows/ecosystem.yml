name: ecosystem

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  ecosystem-regression:
    name: 12-repo ecosystem regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ecosystem regression
        run: bun run test:ecosystem || echo "ecosystem runner not yet implemented (Phase 3k)"
