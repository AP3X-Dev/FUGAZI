name: ecosystem

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  ecosystem-regression:
    name: 12-repo ecosystem regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      SKIP_ECOSYSTEM: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run ecosystem regression
        run: bun tests/ecosystem/runner.ts

      - name: Run Python ecosystem regression
        run: bun tests/ecosystem/py-runner.ts

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecosystem-report
          path: tests/ecosystem/output/
          if-no-files-found: ignore
