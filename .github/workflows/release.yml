name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.0'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      # Publish in dependency order. Each step is gated on `private: false`
      # in the package's own package.json — `npm publish` will refuse to publish
      # a private package, so a step is a no-op until the user opts in
      # (see docs/RELEASE.md).
      - name: Publish fugazi to npm
        working-directory: packages/cli
        run: npm publish --provenance --access public || echo "skipping (package is private)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @fugazi/node to npm
        working-directory: packages/node-api
        run: npm publish --provenance --access public || echo "skipping (package is private)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @fugazi/lsp to npm
        working-directory: packages/lsp
        run: npm publish --provenance --access public || echo "skipping (package is private)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @fugazi/mcp to npm
        working-directory: packages/mcp
        run: npm publish --provenance --access public || echo "skipping (package is private)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @fugazi/plugins to npm
        working-directory: packages/plugins
        run: npm publish --provenance --access public || echo "skipping (package is private)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
