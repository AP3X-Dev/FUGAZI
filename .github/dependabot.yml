version: 2
updates:
  # All npm dependencies across the workspace (root + every package) rolled into
  # a single grouped pull request once a month.
  - package-ecosystem: npm
    directories:
      - '/'
      - '/packages/*'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - '*'

  # GitHub Actions, grouped into one monthly pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
